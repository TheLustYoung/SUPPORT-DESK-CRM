# Plain nginx on the host (no Plesk): /etc/nginx/sites-available/support.conf, then
#   ln -s ../sites-available/support.conf /etc/nginx/sites-enabled/ && certbot --nginx -d support.example.com
# Replace support.example.com; 18180 / 18181 are DASHBOARD_PORT / WEBHOOK_PORT from .env.
server {
    listen 80;
    server_name support.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name support.example.com;
    # certbot fills these in:
    # ssl_certificate     /etc/letsencrypt/live/support.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/support.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Never from the internet: the bot's internal API and health checks.
    location ^~ /internal/ { return 404; }
    location ^~ /health/ { return 404; }

    # Telegram webhook (only used when WEBHOOK_BASE_URL is set; every call is signed with WEBHOOK_SECRET).
    location = /telegram/webhook {
        proxy_pass http://127.0.0.1:18181;
        proxy_set_header Host $host;
        client_max_body_size 1m;
    }

    location / {
        proxy_pass http://127.0.0.1:18180;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;           # the API checks it against ADMIN_ORIGIN
        proxy_set_header X-Forwarded-For $remote_addr;  # the visitor's address: login limits, audit log
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 25m;                       # media library uploads (20 MB)
        proxy_read_timeout 120s;
    }
}
