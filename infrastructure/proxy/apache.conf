# Apache on the host: a2enmod proxy proxy_http headers ssl rewrite; this file in /etc/apache2/sites-available/,
# a2ensite support && certbot --apache -d support.example.com
# Replace support.example.com; 18180 / 18181 are DASHBOARD_PORT / WEBHOOK_PORT from .env.
<VirtualHost *:80>
    ServerName support.example.com
    RewriteEngine on
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName support.example.com
    # certbot fills in SSLEngine / SSLCertificateFile / SSLCertificateKeyFile
    Header always set Strict-Transport-Security "max-age=31536000"
    LimitRequestBody 26214400

    # Never from the internet: the bot's internal API and health checks.
    ProxyPass /internal/ !
    ProxyPass /health/ !
    <LocationMatch "^/(internal|health)/">
        Require all denied
    </LocationMatch>

    ProxyPreserveHost On
    ProxyTimeout 120
    # The visitor's address: replace whatever the client sent (login limits, audit log).
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "https"

    # Telegram webhook (only used when WEBHOOK_BASE_URL is set; every call is signed with WEBHOOK_SECRET).
    ProxyPass        /telegram/webhook http://127.0.0.1:18181/telegram/webhook
    ProxyPassReverse /telegram/webhook http://127.0.0.1:18181/telegram/webhook

    ProxyPass        / http://127.0.0.1:18180/
    ProxyPassReverse / http://127.0.0.1:18180/
</VirtualHost>
