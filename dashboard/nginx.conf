server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # The visitor's address: Docker publishes the port on 127.0.0.1 only, so every request comes through the server's
    # own reverse proxy (Plesk, nginx, Caddy, Apache…), which sends X-Forwarded-For. It is believed only from local and
    # private addresses; the API gets the result in X-Real-IP (login limits, audit log).
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from ::1;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # The dashboard calls the API on its own address: the session cookie never crosses sites.
    location /api/ {
        client_max_body_size 25m;  # media library uploads (20 MB limit in the API)
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
