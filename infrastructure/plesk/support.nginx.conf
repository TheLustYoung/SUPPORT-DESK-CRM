# Support platform on its own domain (or subdomain): dashboard at /, Telegram webhook at /telegram/webhook.
# Plesk: Apache & nginx Settings -> untick "Proxy mode" -> paste into "Additional nginx directives".
# __API_PORT__ / __DASHBOARD_PORT__ / __WEBHOOK_PORT__ are the ports from .env (server-setup.sh prints this file filled in).

# The project folder may live inside httpdocs: never serve it. The bot's API is internal only.
location ^~ /telegram-support/ { return 404; }
location ^~ /internal/ { return 404; }
location ^~ /health/ { return 404; }

# Telegram calls the webhook (only used when WEBHOOK_BASE_URL is set; Telegram signs every call with WEBHOOK_SECRET).
location = /telegram/webhook {
    proxy_pass http://127.0.0.1:__WEBHOOK_PORT__;
    proxy_set_header Host $host;
    client_max_body_size 1m;
    proxy_read_timeout 60s;
}

# Regex form: a plain "location /" can clash with Plesk's own one ("duplicate location").
location ~ ^/ {
    client_max_body_size 25m;  # media library uploads (20 MB)
    proxy_pass http://127.0.0.1:__DASHBOARD_PORT__;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;  # must reach the API unchanged (ADMIN_ORIGIN check)
    proxy_set_header X-Forwarded-For $remote_addr;  # the visitor's address: login limits and the audit log
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
}
